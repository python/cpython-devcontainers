name: ci

on:
  push:
    branches:
      - "main"
  pull_request:
    branches: [main]

permissions: {}

jobs:
  build_dev_container:
    name: Build and test (Dev container)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      # Dummy tag; version does not matter.
      TAG: cpython-devcontainer:1.0.0-${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build Dockerfile
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./devcontainer
          load: true
          tags: ${{ env.TAG }}
      - name: Test clang
        run: docker run --rm "$TAG" clang --version

  build_wasi_container:
    name: Build and test (WASI container)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      TAG: cpython-wasicontainer:1.0.0-${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build Dockerfile
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./wasicontainer
          load: true
          tags: ${{ env.TAG }}
      - name: Test WASI SDK
        run: docker run --rm "$TAG" /opt/wasi-sdk/bin/clang --version
      - name: Test Wasmtime
        run: docker run --rm "$TAG" wasmtime --version

  build_autoconf:
    name: Build and test (Autoconf)
    strategy:
      fail-fast: false
      matrix:
        autoconf_version: ["2.71", "2.72"]
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      TAG: autoconf:${{ matrix.autoconf_version }}-${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build Dockerfile
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./autoconf
          build-args: AUTOCONF_VERSION=${{ matrix.autoconf_version }}
          load: true
          tags: ${{ env.TAG }}
      - name: Test
        run: docker run --rm "$TAG" autoconf --version | grep ${{ matrix.autoconf_version }}
